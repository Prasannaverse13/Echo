# Echo — Google Cloud Build pipeline
# Triggered on push to main, builds the image, pushes to Artifact Registry,
# and deploys to Cloud Run.
#
# Required substitutions (configure in trigger or via gcloud builds):
#   _REGION:               us-central1
#   _REPO:                 echo              (Artifact Registry repo name)
#   _SERVICE:              echo              (Cloud Run service name)
#   _GEMINI_API_KEY:       (set as Secret Manager reference: projects/PROJECT/secrets/gemini-key)
#   _GCP_PROJECT_ID:       echo-hackathon-2026

substitutions:
  _REGION: us-central1
  _REPO: echo
  _SERVICE: echo
  _GCP_PROJECT_ID: echo-hackathon-2026

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # 1. Build the container image
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest
      - --build-arg=NEXT_PUBLIC_GCP_PROJECT_ID=${_GCP_PROJECT_ID}
      - --cache-from=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest
      - .

  # 2. Push the image to Artifact Registry
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}

  # 3. Deploy to Cloud Run (concurrency=80, min-instances=0, max=10)
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=1Gi
      - --cpu=2
      - --concurrency=80
      - --timeout=300
      - --min-instances=0
      - --max-instances=10
      - --set-env-vars=NODE_ENV=production,GCP_PROJECT_ID=${_GCP_PROJECT_ID},GCP_VERTEX_LOCATION=${_REGION},GCP_PUBSUB_TOPIC=echo-runs
      - --set-secrets=GEMINI_API_KEY=gemini-key:latest

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest

timeout: 1200s
