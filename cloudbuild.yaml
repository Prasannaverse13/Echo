# Echo — Google Cloud Build pipeline
# Triggered on push to main. Builds THREE images (API + worker + browser-executor),
# pushes all to Artifact Registry, deploys all to Cloud Run.
#
# Service topology
#   - `echo`              — the Next.js API (HTTP, /api/* routes)
#   - `echo-worker`       — the Pub/Sub listener that invokes the ADK agent
#                           per input. Internal-only, no public ingress.
#   - `echo-browser`      — the Playwright headless browser the agent drives
#                           over HTTP. Internal-only, no public ingress.
#                           The worker calls it via BROWSER_EXECUTOR_URL.
#
# The worker subscribes to the `echo-runs` Pub/Sub topic via the
# `echo-runs-worker` subscription (auto-created on first boot by the
# worker, idempotent). When the API publishes a `run.created` event,
# the worker pulls it, reads the run doc from Firestore, and runs
# `runEchoAgent` for each input with bounded concurrency.
#
# Required substitutions:
#   _REGION:               us-central1
#   _REPO:                 echo
#   _GCP_PROJECT_ID:       echo-hackathon-2026
#   _GEMINI_API_KEY:       Secret Manager reference (gemini-key:latest)

substitutions:
  _REGION: us-central1
  _REPO: echo
  _GCP_PROJECT_ID: echo-hackathon-2026
  _WORKER_DIR: .

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # --- API service ---
  - id: build-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/echo:${SHORT_SHA}
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/echo:latest
      - --build-arg=NEXT_PUBLIC_GCP_PROJECT_ID=${_GCP_PROJECT_ID}
      - --cache-from=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/echo:latest
      - .

  - id: push-api
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/echo

  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - echo
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/echo:${SHORT_SHA}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=1Gi
      - --cpu=2
      - --concurrency=80
      - --timeout=300
      - --min-instances=0
      - --max-instances=10
      - --set-env-vars=NODE_ENV=production,GCP_PROJECT_ID=${_GCP_PROJECT_ID},GCP_VERTEX_LOCATION=${_REGION},GCP_PUBSUB_TOPIC=echo-runs
      - --set-secrets=GEMINI_API_KEY=gemini-key:latest

  # --- Worker service (separate image, separate Cloud Run service) ---
  - id: build-worker
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.worker
      - --build-arg=workerDir=${_WORKER_DIR}
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/echo-worker:${SHORT_SHA}
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/echo-worker:latest
      - --cache-from=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/echo-worker:latest
      - ${_WORKER_DIR}

  - id: push-worker
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/echo-worker

  - id: deploy-worker
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - echo-worker
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/echo-worker:${SHORT_SHA}
      - --platform=managed
      - --no-allow-unauthenticated
      - --port=8080
      - --memory=512Mi
      - --cpu=1
      - --concurrency=10
      - --timeout=3600
      - --min-instances=1
      - --max-instances=20
      - --set-env-vars=NODE_ENV=production,GCP_PROJECT_ID=${_GCP_PROJECT_ID},GCP_VERTEX_LOCATION=${_REGION},GCP_PUBSUB_TOPIC=echo-runs,GCP_PUBSUB_SUBSCRIPTION=echo-runs-worker,WORKER_CONCURRENCY=4,BROWSER_EXECUTOR_URL=https://echo-browser-${_REGION}-a.run.app
      - --set-secrets=GEMINI_API_KEY=gemini-key:latest

  # --- Browser executor service (Playwright + Chromium) ---
  - id: build-browser
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - browser-executor/Dockerfile
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/echo-browser:${SHORT_SHA}
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/echo-browser:latest
      - --cache-from=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/echo-browser:latest
      - browser-executor

  - id: push-browser
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/echo-browser

  - id: deploy-browser
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - echo-browser
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/echo-browser:${SHORT_SHA}
      - --platform=managed
      - --no-allow-unauthenticated
      - --port=8080
      - --memory=2Gi
      - --cpu=2
      - --concurrency=4
      - --timeout=600
      - --min-instances=0
      - --max-instances=4
      - --set-env-vars=NODE_ENV=production,GCP_PROJECT_ID=${_GCP_PROJECT_ID}

  - id: grant-worker-invoker
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - services
      - add-iam-policy-binding
      - echo-browser
      - --region=${_REGION}
      - --member=serviceAccount:${PROJECT_ID}@appspot.gserviceaccount.com
      - --role=roles/run.invoker
    # allowUnauthenticated: false on echo-browser means only Cloud Run
    # services with the invoker role can hit it. The default
    # compute service account has run.invoker on its own project.

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/echo:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/echo:latest
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/echo-worker:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/echo-worker:latest
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/echo-browser:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/echo-browser:latest

timeout: 1800s
